<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OOU Chronicle | Campus News & Updates</title>

    <!-- Favicon -->
    <link rel="icon" href="/images.jpeg" />

    <!-- SEO -->
    <meta
      name="description"
      content="Latest campus news, student stories, events and updates from Olabisi Onabanjo University."
    />

    <meta
      name="keywords"
      content="OOU, OOU Chronicle, Olabisi Onabanjo University, Campus News, Student News, Ogun State"
    />

    <meta name="author" content="OOU Chronicle" />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://oou-chronicles.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="OOU Chronicle | Campus News & Updates" />

    <meta
      property="og:description"
      content="Latest campus news, student stories, events and updates from Olabisi Onabanjo University."
    />

    <meta property="og:url" content="https://oou-chronicles.netlify.app/" />

    <meta property="og:site_name" content="OOU Chronicle" />

    <!-- Share Image -->
    <meta
      property="og:image"
      content="https://oou-chronicles.netlify.app/share.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://oou-chronicles.netlify.app/share.png"
    />

    <meta property="og:image:type" content="image/png" />

    <meta property="og:image:width" content="1536" />

    <meta property="og:image:height" content="1024" />

    <meta property="og:image:alt" content="OOU Chronicle" />

    <!-- Twitter -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="OOU Chronicle | Campus News & Updates"
    />

    <meta
      name="twitter:description"
      content="Latest campus news, student stories and university updates."
    />

    <meta
      name="twitter:image"
      content="https://oou-chronicles.netlify.app/share.png"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#14532d" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NewsMediaOrganization",
        "name": "OOU Chronicle",
        "url": "https://oou-chronicles.netlify.app",
        "logo": {
          "@type": "ImageObject",
          "url": "https://oou-chronicles.netlify.app/images.jpeg"
        },
        "image": "https://oou-chronicles.netlify.app/share.png",
        "description": "Latest campus news, student stories, events and updates from Olabisi Onabanjo University.",
        "publisher": {
          "@type": "Organization",
          "name": "OOU Chronicle",
          "logo": {
            "@type": "ImageObject",
            "url": "https://oou-chronicles.netlify.app/images.jpeg"
          }
        }
      }
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: #fafaf7;
        color: #111827;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      img {
        display: block;
        max-width: 100%;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      button,
      input,
      textarea {
        font: inherit;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
